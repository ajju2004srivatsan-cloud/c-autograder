name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit and reproducibility tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Run CLI end-to-end check
        run: python3 -m autograder.cli submissions/add.c --rules rules/add_two_integers.json --out-dir /tmp/reports
